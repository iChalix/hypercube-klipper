dir_pin: ar55
enable_pin: !ar38
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 0
position_max: 290
rotation_distance: 40
full_steps_per_rotation: 200
homing_speed: 30
homing_retract_dist: 0
microsteps: 16

[tmc2130 stepper_y]
